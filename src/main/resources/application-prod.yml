# ============================================================================
# prod —— 生产环境
# 特点：独立生产库、日志 INFO（不打印 SQL，避免日志膨胀与敏感信息泄露）、
#       连接池放大、连接超时收紧
# 启动：java -jar taskmaster-boot.war --spring.profiles.active=prod
#
# 注意：生产库为 taskmaster_prod，需先执行 sql/init_prod.sql。
#       真实项目里密码应通过环境变量或配置中心注入，不写死在文件里 ——
#       这里为教学演示保留明文，报告中已作为改进点说明。
# ============================================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskmaster_prod?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    # 生产环境建议改为 ${MYSQL_PASSWORD} 形式，从环境变量注入
    password: fuzhanpeng602
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

task:
  system-name: TaskMaster
  env-label: PROD
  welcome-message: 欢迎使用任务管理系统

logging:
  level:
    root: INFO
    # 生产环境不打印 SQL
    cn.edu.mju.task.mapper: INFO
