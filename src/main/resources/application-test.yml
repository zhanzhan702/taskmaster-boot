# ============================================================================
# test —— 测试环境
# 特点：连独立测试库（不污染开发数据）、日志 WARN、SQL 不打印
# 启动：java -jar taskmaster-boot.war --spring.profiles.active=test
#
# 注意：测试库为 taskmaster_test，需先执行 sql/init_test.sql 建库建表。
#       这正是"数据源一键隔离"的实证 —— 切 profile 后连的是另一个库。
# ============================================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskmaster_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: fuzhanpeng602
    hikari:
      # 测试环境连接池调小，避免占满数据库连接
      maximum-pool-size: 4
      minimum-idle: 1

task:
  system-name: TaskMaster（测试）
  env-label: TEST
  welcome-message: 欢迎使用任务管理系统 · 测试环境

logging:
  level:
    root: WARN
    cn.edu.mju.task: INFO
