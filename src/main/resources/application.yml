# ============================================================================
# TaskMaster · SpringBoot 现代化版主配置（实验五）
# ============================================================================
#
# 与实验四相比，本文件有三处关键变化：
#   1. 删除 spring.mvc.view.* —— Thymeleaf 有约定的模板目录（classpath:/templates/），
#      不再需要手工配置前缀后缀；
#   2. mybatis.* → mybatis-plus.*，并且用「约定优于配置」把实体与表的映射规则外置：
#      table-prefix 让 Task → t_task、User → t_user，实体类因此可以零注解；
#   3. server.port 与 profile 机制沿用实验四，部署时用 --server.port 覆盖即可。
#
# 切换环境：
#   java -jar taskmaster-plus.jar                             # dev（默认）
#   java -jar taskmaster-plus.jar --spring.profiles.active=test
#   java -jar taskmaster-plus.jar --spring.profiles.active=prod --server.port=9090
# ============================================================================

server:
  port: 8084
  servlet:
    context-path: /
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev

  application:
    name: taskmaster-plus

  mvc:
    pathmatch:
      # 实验六：springdoc-openapi 1.6.x 与 Spring Boot 2.6+ 默认的 PathPatternParser 存在冲突，
      # 表现为 /v3/api-docs 返回 200 但 paths 为空（一条接口都扫不到，也不报错）。
      # 官方给的解法就是切回 AntPathMatcher。
      matching-strategy: ant_path_matcher

  # Thymeleaf：模板默认位于 classpath:/templates/，后缀 .html
  # 因此不需要像 JSP 那样配置 InternalResourceViewResolver
  thymeleaf:
    # 开发期关闭缓存，改完模板刷新浏览器即可生效；生产环境应设为 true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    # 非严格模式：允许没有闭合标签的 HTML5 写法（如 <input> 不写 />
    mode: HTML
    servlet:
      content-type: text/html

  # 数据源（具体 url/username/password 由各 profile 覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# MyBatis-Plus：取代实验四的 mybatis.* 配置
mybatis-plus:
  # 实体类别名包：XML 里可直接写 Task 而不是全限定名
  # （本项目的 XML 已删除，但保留该配置可避免将来加 XML 时踩「Could not resolve type alias」）
  type-aliases-package: cn.edu.mju.task.entity
  # 约定：表名 = t_ + 类名（Task → t_task，User → t_user），
  # 因此实体类不需要写 @TableName，只需继承 BaseMapper 即可工作
  global-config:
    db-config:
      table-prefix: t_
      # 主键策略：数据库自增（默认是雪花算法 ASSIGN_ID，与 int 自增主键不兼容）
      id-type: auto
      # 逻辑删除未启用；若启用则 deleteById 会变成 UPDATE deleted=1
  configuration:
    # 下划线列名 ↔ 驼峰属性（due_date → dueDate）
    map-underscore-to-camel-case: true
    # 让 SQL 可见：开发期排查「MyBatis-Plus 到底替我生成了什么 SQL」全靠它。
    # 注意这是全局强制项，会让 prod 也打印，因此只在 dev profile 生效（见 application-dev.yml）

# 实验六：OpenAPI 文档（springdoc）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # 扫描范围要覆盖到「有对外接口的所有包」。
  # 曾经写成 cn.edu.mju.task.controller，结果新增的 cn.edu.mju.task.api 被排除在外，
  # /v3/api-docs 返回 200 但 paths 为空 —— 这种「配了反而更糟」的坑很难从现象反推。
  packages-to-scan: cn.edu.mju.task
  paths-to-match: /**

# 业务参数（TaskProperties 绑定，用于在页面显示当前环境）
task:
  system-name: TaskMaster
  env-label: dev
  welcome-message: 欢迎使用任务管理系统（开发环境）

logging:
  level:
    root: INFO
