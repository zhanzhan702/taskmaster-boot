<!DOCTYPE html>
<!--
  ============================================================================
  表单片段（Thymeleaf Fragment）—— 实验五环节二
  ============================================================================

  这是 Thymeleaf 相对 JSP 最实在的一处改进。
  实验四的 add.jsp 与 edit.jsp 有 90% 完全重复（只有标题文字和是否带 id 不同），
  当时在《原生开发痛点清单》第 8 条里记过一笔；JSP 没有原生的片段复用机制，
  只能靠 include 或自定义标签，都不方便。

  现在用 th:fragment 声明一个可复用片段，add.html / edit.html 各一行 th:replace 即可：

      <div th:replace="~{fragments/task-form :: taskForm(${form}, '/task/add', '新增任务')}"></div>

  片段参数：form 表单对象、postUrl 提交地址、heading 标题文字。

  另一个细节：th:errors="*{title}" 会从 BindingResult 里取出该字段的校验消息，
  显示在输入框下方 —— 这就是「表单错误回显」，不需要控制器拼任何字符串。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<form th:fragment="taskForm(form, postUrl, heading)"
      method="post"
      th:action="@{${postUrl}}"
      th:object="${form}"
      class="card">

    <h2 th:text="${heading}">新增任务</h2>

    <!-- 业务校验失败（Service 抛出的 ServiceException）显示在这里 -->
    <div class="form-error" th:if="${formError}" th:text="${formError}">任务名称不能为空</div>

    <!-- 对象级校验错误（当前没有，但保留以示范 #fields.globalErrors()） -->
    <div class="form-error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}">对象级错误</p>
    </div>

    <div class="field">
        <label for="title">任务名称 <em>*</em></label>
        <input type="text" id="title" name="title" maxlength="255"
               placeholder="请输入任务名称"
               th:value="${form.title}"/>
        <!-- 字段级校验错误回显 -->
        <p class="field-error" th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">任务名称不能为空</p>
    </div>

    <div class="field">
        <label for="priority">优先级别 <em>*</em></label>
        <select id="priority" name="priority">
            <option value="1" th:selected="${form.priority != null and form.priority == 1}">低</option>
            <option value="2" th:selected="${form.priority != null and form.priority == 2}">中</option>
            <option value="3" th:selected="${form.priority != null and form.priority == 3}">高</option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('priority')}"
           th:errors="*{priority}">优先级取值应为 1~3</p>
    </div>

    <div class="field">
        <label for="status">任务状态 <em>*</em></label>
        <select id="status" name="status">
            <option value="0" th:selected="${form.status != null and form.status == 0}">待办</option>
            <option value="1" th:selected="${form.status != null and form.status == 1}">进行中</option>
            <option value="2" th:selected="${form.status != null and form.status == 2}">已完成</option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('status')}"
           th:errors="*{status}">任务状态取值应为 0~2</p>
    </div>

    <div class="field">
        <label for="dueDate">截止日期 <em>*</em></label>
        <input type="date" id="dueDate" name="dueDate"
               th:value="${form.dueDate != null} ? ${#dates.format(form.dueDate, 'yyyy-MM-dd')} : ''"/>
        <p class="field-error" th:if="${#fields.hasErrors('dueDate')}"
           th:errors="*{dueDate}">截止日期不能为空</p>
        <p class="tip">客户端也会校验，但可以绕过 —— 真正生效的是服务端的 @Valid。</p>
    </div>

    <div class="actions">
        <button type="submit">提交</button>
        <a th:href="@{/task/list}">返回列表</a>
    </div>
</form>

</body>
</html>
