<!DOCTYPE html>
<!--
  ============================================================================
  任务列表（Thymeleaf）—— 实验五环节二
  ============================================================================

  与 JSP 的差别（对照实验四的 list.jsp）：
    1. 这是一个**纯 HTML 文件**，双击用浏览器直接打开就能看到静态效果，
       不需要启动 Tomcat —— 这就是「静态可预览」；
    2. 没有一行 Java 脚本片段：循环用 th:each、判断用 th:if、输出用 th:text；
    3. th:text 默认转义 HTML，所以不必再手工调 WebUtil.escape()，
       想输出原始 HTML 才需要显式写 th:utext（危险，需自行确保内容可信）；
    4. 链接用 @{...} 生成，context-path 自动处理，不再手写 ${ctx}。

  注意 th:remove="all" 的用法：带该属性的元素在「渲染时」会被整个删掉，
  但在「静态预览时」仍然可见。这样既能让文件单独打开时有内容可看，
  又不会污染真实页面 —— 是 Thymeleaf 特有的便利。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>任务列表 · TaskMaster</title>
    <style>
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; margin: 28px; color: #222; }
        h2 { margin: 0 0 12px; font-size: 22px; }
        .badge { font-size: 12px; color: #fff; background: #36c; padding: 2px 8px;
                 border-radius: 10px; vertical-align: middle; margin-left: 8px; }
        .bar { margin: 12px 0; padding: 10px 12px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; }
        .bar label { margin-right: 6px; }
        .bar input[type=text] { width: 200px; padding: 4px 6px; }
        .bar select { padding: 4px 6px; }
        .bar button, .btn { padding: 4px 12px; cursor: pointer; }
        .hint { color: #888; font-size: 13px; margin-left: 8px; }
        table { border-collapse: collapse; width: 100%; margin-top: 12px; }
        th, td { border: 1px solid #d0d7de; padding: 8px 10px; font-size: 14px; text-align: left; }
        th { background: #f0f3f6; font-weight: 600; }
        tr:nth-child(even) td { background: #fafbfc; }
        .ops form { display: inline; }
        .ops button { padding: 2px 8px; margin-right: 4px; cursor: pointer; }
        .msg { color: #1a7f37; background: #e6f4ea; border: 1px solid #b7e1c5;
               padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
        .empty { color: #888; padding: 24px; text-align: center; border: 1px dashed #ccc; margin-top: 12px; }
        .pager { margin-top: 16px; font-size: 14px; }
        .pager a, .pager span { display: inline-block; padding: 4px 10px; margin-right: 4px;
                                border: 1px solid #d0d7de; border-radius: 4px; text-decoration: none; color: #0969da; }
        .pager span.cur { background: #0969da; color: #fff; border-color: #0969da; }
        .pager span.dis { color: #aaa; border-color: #eaeaea; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
        .s0 { background: #eaeef2; color: #444; }
        .s1 { background: #fff4d6; color: #8a5a00; }
        .s2 { background: #e6f4ea; color: #1a7f37; }
    </style>
</head>
<body>

<h2>
    任务列表
    <span class="badge" th:text="${envLabel}">DEV</span>
</h2>

<p class="hint">
    系统：<span th:text="${systemName}">TaskMaster</span>
    ｜ 当前用户：<strong th:text="${session.loginUser != null} ? ${session.loginUser.nickname} : '未登录'">管理员</strong>
    ｜ <a th:href="@{/task/add}">＋ 新增任务</a>
    ｜ <a th:href="@{/logout}">退出登录</a>
</p>

<!-- 提示消息：来自 RedirectAttributes 的 Flash 属性，只显示一次 -->
<div class="msg" th:if="${msg}" th:text="${msg}">新增成功</div>

<!-- ==================== 条件查询 ==================== -->
<form class="bar" method="get" th:action="@{/task/list}">
    <label for="title">任务名称</label>
    <input type="text" id="title" name="title" maxlength="255"
           placeholder="支持模糊查询" th:value="${queryTitle}"/>
    <label for="status">任务状态</label>
    <select id="status" name="status">
        <option value="" th:selected="${queryStatus == null}">全部</option>
        <option value="0" th:selected="${queryStatus != null and queryStatus == 0}">待办</option>
        <option value="1" th:selected="${queryStatus != null and queryStatus == 1}">进行中</option>
        <option value="2" th:selected="${queryStatus != null and queryStatus == 2}">已完成</option>
    </select>
    <button type="submit">查询</button>
    <a th:href="@{/task/list}">重置</a>
</form>

<p class="hint">
    共 <strong th:text="${page.total}">0</strong> 条记录，
    第 <strong th:text="${page.current}">1</strong> /
    <strong th:text="${page.pages}">1</strong> 页
    <span th:if="${queryTitle != null and !queryTitle.isEmpty()} or ${queryStatus != null}">（已按条件筛选）</span>
</p>

<!-- ==================== 数据表格 ==================== -->
<table>
    <thead>
    <tr>
        <th style="width:70px">编号</th>
        <th>任务名称</th>
        <th style="width:90px">状态</th>
        <th style="width:90px">优先级</th>
        <th style="width:120px">截止日期</th>
        <th style="width:120px">创建日期</th>
        <th style="width:230px">操作</th>
    </tr>
    </thead>
    <tbody>
    <!-- th:each 遍历当前页数据；th:classappend 按状态给徽标上色 -->
    <tr th:each="task : ${page.records}">
        <td th:text="${task.id}">1</td>
        <td th:text="${task.title}">示例任务</td>
        <td><span class="tag" th:classappend="'s' + ${task.status}"
                  th:text="${task.statusLabel}">待办</span></td>
        <td th:text="${task.priorityLabel}">中</td>
        <td th:text="${task.dueDateText}">2026-12-01</td>
        <td th:text="${task.createDateText}">2026-11-01</td>
        <td class="ops">
            <a th:href="@{/task/edit/{id}(id=${task.id})}">修改</a>
            <form method="post" th:action="@{/task/delete/{id}(id=${task.id})}"
                  onsubmit="return confirm('确定要删除该任务吗？');">
                <button type="submit">删除</button>
            </form>
            <form method="post" th:action="@{/task/status/{id}(id=${task.id})}">
                <input type="hidden" name="action"
                       th:value="${task.status == 0} ? 'start' : (${task.status == 1} ? 'complete' : 'reopen')"/>
                <button type="submit"
                        th:text="${task.status == 0} ? '开始' : (${task.status == 1} ? '完成' : '重新打开')">开始</button>
            </form>
        </td>
    </tr>

    <!-- 仅用于静态预览：渲染时被整行删除（th:remove="all"） -->
    <tr th:remove="all">
        <td>1</td>
        <td>完成实验报告（静态预览示例）</td>
        <td><span class="tag s0">待办</span></td>
        <td>高</td>
        <td>2026-12-01</td>
        <td>2026-11-09</td>
        <td class="ops">修改 / 删除 / 开始</td>
    </tr>
    </tbody>
</table>

<!-- 空态：th:if 判断当前页是否没有数据 -->
<div class="empty" th:if="${page.records.isEmpty()}">
    <span th:if="${queryTitle != null and !queryTitle.isEmpty()} or ${queryStatus != null}">没有符合条件的任务，试试放宽条件。</span>
    <span th:unless="${queryTitle != null and !queryTitle.isEmpty()} or ${queryStatus != null}">暂无任务数据，点击上方「新增任务」开始。</span>
</div>

<!-- ==================== 分页控件 ==================== -->
<!-- 页码窗口 from/to 由控制器算好（见 TaskController.list），模板只负责渲染 -->
<div class="pager" th:if="${page.pages > 1}">
    <!-- 首页 / 上一页：不可用时用 span 占位，避免点进去仍是同一页 -->
    <a th:if="${page.current > 1}"
       th:href="@{/task/list(page=1, title=${queryTitle}, status=${queryStatus})}">首页</a>
    <span class="dis" th:unless="${page.current > 1}">首页</span>

    <a th:if="${page.current > 1}"
       th:href="@{/task/list(page=${page.current - 1}, title=${queryTitle}, status=${queryStatus})}">上一页</a>
    <span class="dis" th:unless="${page.current > 1}">上一页</span>

    <th:block th:each="i : ${#numbers.sequence(pageFrom, pageTo)}">
        <span class="cur" th:if="${i == page.current}" th:text="${i}">1</span>
        <a th:unless="${i == page.current}"
           th:href="@{/task/list(page=${i}, title=${queryTitle}, status=${queryStatus})}"
           th:text="${i}">2</a>
    </th:block>

    <a th:if="${page.current < page.pages}"
       th:href="@{/task/list(page=${page.current + 1}, title=${queryTitle}, status=${queryStatus})}">下一页</a>
    <span class="dis" th:unless="${page.current < page.pages}">下一页</span>

    <a th:if="${page.current < page.pages}"
       th:href="@{/task/list(page=${page.pages}, title=${queryTitle}, status=${queryStatus})}">末页</a>
    <span class="dis" th:unless="${page.current < page.pages}">末页</span>

    <span class="hint">每页 <span th:text="${page.size}">5</span> 条</span>
</div>

</body>
</html>
