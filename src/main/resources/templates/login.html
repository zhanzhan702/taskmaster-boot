<!DOCTYPE html>
<!--
  登录页（Thymeleaf）—— 实验五环节五
  同样是纯 HTML，静态打开即可看到完整表单，不依赖任何服务器。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'登录 · ' + ${systemName}">登录 · TaskMaster</title>
    <style th:replace="~{fragments/style :: css}"></style>
</head>
<body>

<div class="card">
    <h2 th:text="${systemName} + ' 登录'">TaskMaster 登录</h2>

    <p class="hint">
        当前环境：<strong th:text="${envLabel}">DEV</strong>
        <span th:if="${welcomeMessage != null and !welcomeMessage.isEmpty()}"
              th:text="'｜ ' + ${welcomeMessage}">｜ 欢迎</span>
    </p>

    <!-- 已退出 / 其他一次性提示 -->
    <div class="notice" th:if="${notice}" th:text="${notice}">您已安全退出。</div>

    <!-- 登录失败提示（由 AuthController 放入 model） -->
    <div class="form-error" th:if="${error}" th:text="${error}">用户名或密码错误</div>

    <form method="post" th:action="@{/login}">
        <!-- 登录后跳回原地址；由 LoginInterceptor 在跳转时带上 -->
        <input type="hidden" name="redirect" th:value="${param.redirect}"/>

        <div class="field">
            <label for="loginName">用户名</label>
            <input type="text" id="loginName" name="loginName" maxlength="50"
                   th:value="${loginName}" placeholder="admin"/>
        </div>

        <div class="field">
            <label for="loginPwd">密码</label>
            <input type="password" id="loginPwd" name="loginPwd" maxlength="50"/>
        </div>

        <div class="actions">
            <button type="submit">登录</button>
        </div>
    </form>

    <p class="hint" style="margin-top:14px;">测试账号：admin / 123456</p>
</div>

</body>
</html>
